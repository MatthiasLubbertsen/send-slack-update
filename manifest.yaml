display_information:
  name: Daily Update Bot
  description: Post your daily update to Slack
  background_color: "#111111"

features:
  bot_user:
    display_name: daily-update-bot
    always_online: true

oauth_config:
  scopes:
    bot:
      # The only required scope: the app posts messages with chat.postMessage.
      - chat:write
      # Optional: show the user group handle and channel name in the UI
      # instead of their IDs.
      # - usergroups:read
      # - channels:read

settings:
  # The app doesn't listen to any Slack events; it only calls the Web API.
  event_subscriptions:
    bot_events: []
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
